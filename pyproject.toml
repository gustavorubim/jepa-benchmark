[project]
name = "jepa-robotics"
version = "0.1.0"
description = "Small-scale JEPA world-model benchmark for goal-conditioned robotics."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "gymnasium>=1.0.0",
  "gymnasium-robotics>=1.3.1",
  "matplotlib>=3.8.0",
  "mujoco>=3.2.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "pydantic>=2.7.0",
  "pyyaml>=6.0.1",
  "rich>=13.7.0",
  "sb3-contrib>=2.4.0",
  "scikit-learn>=1.4.0",
  "scipy>=1.12.0",
  "seaborn>=0.13.0",
  "stable-baselines3>=2.4.0",
  "tensorboard>=2.16.0",
  "torch>=2.3.0",
  "torchvision>=0.18.0",
  "tqdm>=4.66.0",
  "typer>=0.12.0",
]

[dependency-groups]
dev = [
  "mypy>=1.10.0",
  "pre-commit>=3.7.0",
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
]

[project.scripts]
jepa-robotics = "jepa_robotics.cli.run_experiment:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jepa_robotics"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = false
warn_unreachable = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["src/jepa_robotics"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
