experiment:
  name: autoencoder
  output_dir: outputs/autoencoder
  seeds: [0, 1, 2, 3, 4]
env:
  id: FetchReachDense-v3
  obs_mode: state
  max_episode_steps: 50
dataset:
  source: random
  num_episodes: 1000
  max_episode_steps: 50
  n_envs: 4
autoencoder:
  latent_dim: 128
  hidden_dims: [256, 256]
  batch_size: 512
  epochs: 50
  learning_rate: 0.0003
  validation_fraction: 0.2
device:
  preferred: auto
