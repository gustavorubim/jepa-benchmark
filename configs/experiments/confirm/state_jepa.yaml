experiment:
  name: state_jepa_confirm
  output_dir: outputs/state_jepa_confirm
  seeds: [0]
env:
  id: FetchReachDense-v3
  obs_mode: state
  max_episode_steps: 50
dataset:
  source: random
  num_episodes: 1000
  max_episode_steps: 50
  n_envs: 4
jepa:
  latent_dim: 128
  hidden_dims: [256, 256]
  prediction_horizons: [1, 2, 4, 8]
  batch_size: 512
  epochs: 60
  validation_fraction: 0.2
device:
  preferred: auto
