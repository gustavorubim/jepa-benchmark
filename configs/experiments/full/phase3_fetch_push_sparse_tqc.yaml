experiment:
  name: phase3_fetch_push_sparse_tqc_full
  output_dir: outputs/phase3_fetch_push_sparse_tqc_full
  seeds: [0]
env:
  id: FetchPush-v3
  obs_mode: state
  max_episode_steps: 50
rl:
  algorithm: TQC
  policy: MultiInputPolicy
  replay_buffer_class: HerReplayBuffer
  replay_buffer_kwargs:
    n_sampled_goal: 4
    goal_selection_strategy: future
    copy_info_dict: false
  total_timesteps: 1000000
  eval_freq: 10000
  train_eval_episodes: 20
  final_eval_episodes: 20
  n_eval_episodes: 20
  n_envs: 2
  vec_env_type: dummy
  early_stop_success: 0.85
  early_stop_patience: 3
  learning_rate: 0.001
  batch_size: 512
  gamma: 0.98
  tau: 0.005
  policy_net_arch: [512, 512, 512]
  n_critics: 2
  time_feature_wrapper: true
dataset:
  source: mixture
  num_episodes: 1000
  max_episode_steps: 50
  n_envs: 4
jepa:
  latent_dim: 128
  hidden_dims: [256, 256]
  prediction_horizons: [1, 2, 4, 8]
  epochs: 100
device:
  preferred: auto
