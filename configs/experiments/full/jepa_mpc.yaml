experiment:
  name: jepa_mpc_full
  output_dir: outputs/jepa_mpc_full
  comparison_group: reach_dense_full_100k
  seeds: [0]
env:
  id: FetchReachDense-v4
  obs_mode: state
  max_episode_steps: 50
rl:
  n_eval_episodes: 20
  final_eval_episodes: 20
dataset:
  source: random
  num_episodes: 1920
  max_episode_steps: 50
  n_envs: 4
jepa:
  latent_dim: 128
  hidden_dims: [256, 256]
  prediction_horizons: [1, 2, 4]
  batch_size: 256
  epochs: 20
mpc:
  planner: cem
  horizon: 4
  num_candidates: 256
  num_elites: 32
  iterations: 3
  lambda_action: 0.001
  dataset_budgets: [400, 1000, 1920]
device:
  preferred: auto
