experiment:
  name: phase2_fetch_push_dense
  output_dir: outputs/phase2_fetch_push_dense
  seeds: [0]
env:
  id: FetchPushDense-v4
  obs_mode: state
  max_episode_steps: 50
rl:
  algorithm: SAC
  total_timesteps: 500000
  eval_freq: 10000
  n_eval_episodes: 20
dataset:
  source: mixture
  num_episodes: 1000
jepa:
  latent_dim: 128
  hidden_dims: [256, 256]
  prediction_horizons: [1, 2, 4, 8]
  batch_size: 512
  epochs: 100
mpc:
  planner: cem
  horizon: 8
  num_candidates: 512
  num_elites: 64
  iterations: 4
device:
  preferred: auto
