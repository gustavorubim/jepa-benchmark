experiment:
  name: phase3_fetch_push_sparse_iteration
  output_dir: outputs/phase3_fetch_push_sparse_iteration
  seeds: [0]
env:
  id: FetchPush-v3
  obs_mode: state
  max_episode_steps: 50
rl:
  algorithm: SAC
  policy: MultiInputPolicy
  replay_buffer_class: HerReplayBuffer
  replay_buffer_kwargs:
    n_sampled_goal: 4
    goal_selection_strategy: future
    copy_info_dict: true
  total_timesteps: 250000
  eval_freq: 10000
  train_eval_episodes: 5
  final_eval_episodes: 10
  n_eval_episodes: 10
  n_envs: 2
  vec_env_type: dummy
  early_stop_success: 0.80
  early_stop_patience: 2
  learning_starts: 5000
  batch_size: 256
dataset:
  source: mixture
  num_episodes: 250
  max_episode_steps: 50
  n_envs: 4
jepa:
  latent_dim: 128
  hidden_dims: [256, 256]
  prediction_horizons: [1, 2, 4]
  batch_size: 512
  epochs: 30
mpc:
  planner: cem
  horizon: 6
  num_candidates: 256
  num_elites: 32
  iterations: 3
device:
  preferred: auto
