experiment:
  name: phase1_fetch_reach
  output_dir: outputs/phase1_fetch_reach
  seeds: [0, 1, 2, 3, 4]
env:
  id: FetchReachDense-v3
  obs_mode: state
  max_episode_steps: 50
rl:
  algorithm: SAC
  policy: MultiInputPolicy
  total_timesteps: 250000
  eval_freq: 10000
  n_eval_episodes: 20
  learning_rate: 0.0003
  batch_size: 256
  gamma: 0.98
  buffer_size: 1000000
dataset:
  source: mixture
  num_episodes: 1000
  max_episode_steps: 50
jepa:
  latent_dim: 128
  hidden_dims: [256, 256]
  prediction_horizons: [1, 2, 4, 8]
  batch_size: 512
  epochs: 100
  learning_rate: 0.0003
  ema_momentum: 0.996
mpc:
  planner: cem
  horizon: 8
  num_candidates: 512
  num_elites: 64
  iterations: 4
  lambda_action: 0.001
device:
  preferred: auto
