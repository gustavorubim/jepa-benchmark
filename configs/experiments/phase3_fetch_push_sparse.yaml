experiment:
  name: phase3_fetch_push_sparse
  output_dir: outputs/phase3_fetch_push_sparse
  seeds: [0, 1, 2, 3, 4]
env:
  id: FetchPush-v3
  obs_mode: state
  max_episode_steps: 50
rl:
  algorithm: SAC
  policy: MultiInputPolicy
  replay_buffer_class: HerReplayBuffer
  replay_buffer_kwargs:
    n_sampled_goal: 4
    goal_selection_strategy: future
    copy_info_dict: true
  total_timesteps: 500000
  eval_freq: 10000
  n_eval_episodes: 20
dataset:
  source: mixture
  num_episodes: 1000
jepa:
  latent_dim: 128
  hidden_dims: [256, 256]
  prediction_horizons: [1, 2, 4, 8]
mpc:
  planner: cem
  horizon: 8
  num_candidates: 512
  num_elites: 64
device:
  preferred: auto
