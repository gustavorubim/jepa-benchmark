experiment:
  name: reach_dense_matched_state_jepa
  output_dir: outputs/reach_dense_matched_state_jepa
  comparison_group: reach_dense_matched_6k
  seeds: [0, 1, 2, 3, 4]
env:
  id: FetchReachDense-v4
  obs_mode: state
  max_episode_steps: 50
dataset:
  source: random
  num_episodes: 100
  max_episode_steps: 50
  n_envs: 4
jepa:
  latent_dim: 64
  hidden_dims: [128, 128]
  prediction_horizons: [1, 2, 4]
  batch_size: 256
  epochs: 5
  validation_fraction: 0.2
device:
  preferred: auto
