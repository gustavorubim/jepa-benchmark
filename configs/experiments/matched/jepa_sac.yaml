experiment:
  name: reach_dense_matched_jepa_sac
  output_dir: outputs/reach_dense_matched_jepa_sac
  comparison_group: reach_dense_matched_6k
  seeds: [0]
env:
  id: FetchReachDense-v4
  obs_mode: state
  max_episode_steps: 50
rl:
  algorithm: SAC
  policy: MultiInputPolicy
  total_timesteps: 1000
  eval_freq: 250
  train_eval_episodes: 3
  final_eval_episodes: 5
  n_eval_episodes: 5
  n_envs: 2
  vec_env_type: dummy
  learning_starts: 100
dataset:
  source: random
  num_episodes: 100
  max_episode_steps: 50
  n_envs: 4
jepa:
  latent_dim: 64
  hidden_dims: [128, 128]
  prediction_horizons: [1, 2, 4]
  batch_size: 256
  epochs: 5
device:
  preferred: auto
